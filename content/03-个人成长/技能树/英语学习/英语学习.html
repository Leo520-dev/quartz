<style>

function removeError(i){const filtered=currentErrorFilter==='all'?errorWords:errorWords.filter(e=>e.source===currentErrorFilter);const wordToRemove=filtered[i];errorWords=errorWords.filter(e=>e!==wordToRemove);renderErrors(currentErrorFilter);saveData();showToast(`已从错题本移除「${wordToRemove.word}」`);}

// ===== Review Modes =====
let currentMode='',fcIndex=0,fcResults=[],quizIndex=0,quizResults=[],quizQuestions=[],spellingIndex=0,spellingResults=[],spellingWords=[],spellingHintCount=0;

function exitReviewMode(){document.getElementById('reviewModeSection').style.display='block';['flashcardPanel','quizPanel','spellingPanel','reviewResult'].forEach(id=>document.getElementById(id).style.display='none');}
function restartReviewMode(){document.getElementById('reviewResult').style.display='none';if(currentMode==='flashcard')startFlashcard();if(currentMode==='quiz')startQuiz();if(currentMode==='spelling')startSpelling();}

// Flashcard
function startFlashcard(){if(reviewWords.length===0){showToast('暂无复习单词，请先在词书中学习单词');return;}currentMode='flashcard';document.getElementById('reviewModeSection').style.display='none';['quizPanel','spellingPanel','reviewResult'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById('flashcardPanel').style.display='block';fcIndex=0;fcResults=[];loadFlashcard();}
function loadFlashcard(){const w=reviewWords[fcIndex];document.getElementById('fcWord').textContent=w.word;document.getElementById('fcPhonetic').textContent=w.phonetic;document.getElementById('fcMeaning').textContent=w.meaning;document.getElementById('fcExample').textContent='"'+w.example+'"';document.getElementById('flashcard').classList.remove('flipped');document.getElementById('fcProgressText').textContent=`${fcIndex+1} / ${reviewWords.length}`;document.getElementById('fcProgressBar').style.width=`${(fcIndex+1)/reviewWords.length*100}%`;const auto=document.getElementById('autoTTS');if(auto&&auto.checked)setTimeout(()=>speak(w.word),300);}
function flipFlashcard(){document.getElementById('flashcard').classList.toggle('flipped');}
function flashcardMark(known){fcResults.push({word:reviewWords[fcIndex].word,correct:known});if(!known)addToErrors(reviewWords[fcIndex],'flashcard');fcIndex++;if(fcIndex>=reviewWords.length)showReviewResult('flashcard');else loadFlashcard();}

// Quiz
function startQuiz(){if(reviewWords.length===0){showToast('暂无复习单词，请先在词书中学习单词');return;}currentMode='quiz';document.getElementById('reviewModeSection').style.display='none';['flashcardPanel','spellingPanel','reviewResult'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById('quizPanel').style.display='block';quizIndex=0;quizResults=[];quizQuestions=reviewWords.slice(0,10).map(w=>({word:w.word,correct:w.meaning,options:shuffleOptions(w)}));loadQuizQuestion();}
function shuffleOptions(w){const others=reviewWords.filter(r=>r.meaning!==w.meaning).sort(()=>Math.random()-0.5).slice(0,3).map(r=>r.meaning);return[w.meaning,...others].sort(()=>Math.random()-0.5);}
function loadQuizQuestion(){const q=quizQuestions[quizIndex];document.getElementById('quizWord').innerHTML=`${q.word} <button class="tts-btn" onclick="speak('${q.word}')">🔊</button>`;document.getElementById('quizOptions').innerHTML=q.options.map((o,i)=>`<button class="quiz-option" onclick="checkQuizAnswer(${i})">${o}</button>`).join('');document.getElementById('quizFeedback').style.display='none';document.getElementById('quizProgressText').textContent=`${quizIndex+1} / ${quizQuestions.length}`;document.getElementById('quizProgressBar').style.width=`${(quizIndex+1)/quizQuestions.length*100}%`;}
function checkQuizAnswer(i){const q=quizQuestions[quizIndex];const opts=document.querySelectorAll('.quiz-option');opts.forEach(o=>o.classList.add('disabled'));const correctIdx=q.options.indexOf(q.correct);if(i===correctIdx){opts[i].classList.add('correct');quizResults.push({word:q.word,correct:true});}else{opts[i].classList.add('wrong');opts[correctIdx].classList.add('correct');quizResults.push({word:q.word,correct:false});const w=reviewWords.find(r=>r.word===q.word);if(w)addToErrors(w,'quiz');}document.getElementById('quizFeedback').style.display='block';}
function nextQuizQuestion(){quizIndex++;if(quizIndex>=quizQuestions.length)showReviewResult('quiz');else loadQuizQuestion();}

// Spelling
function startSpelling(){if(reviewWords.length===0){showToast('暂无复习单词，请先在词书中学习单词');return;}currentMode='spelling';document.getElementById('reviewModeSection').style.display='none';['flashcardPanel','quizPanel','reviewResult'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById('spellingPanel').style.display='block';spellingIndex=0;spellingResults=[];spellingWords=reviewWords.slice(0,10);spellingHintCount=0;loadSpellingWord();}
function loadSpellingWord(){const w=spellingWords[spellingIndex];document.getElementById('spellingMeaning').textContent=w.meaning;document.getElementById('spellingPhonetic').textContent=w.phonetic;document.getElementById('spellingExample').textContent='"'+w.example.replace(new RegExp(w.word,'gi'),'_____')+'"';const input=document.getElementById('spellingInput');input.value='';input.className='spelling-input';input.disabled=false;document.getElementById('spellingFeedback').style.display='none';document.getElementById('spellingProgressText').textContent=`${spellingIndex+1} / ${spellingWords.length}`;document.getElementById('spellingProgressBar').style.width=`${(spellingIndex+1)/spellingWords.length*100}%`;spellingHintCount=0;input.focus();}
function submitSpelling(){const w=spellingWords[spellingIndex];const input=document.getElementById('spellingInput');const answer=input.value.trim().toLowerCase();const correct=w.word.toLowerCase();const isCorrect=answer===correct;input.classList.add(isCorrect?'correct':'wrong');input.disabled=true;spellingResults.push({word:w.word,correct:isCorrect});if(!isCorrect)addToErrors(w,'spelling');const fb=document.getElementById('spellingFeedback');document.getElementById('spellingResult').className='spelling-result '+(isCorrect?'correct':'wrong');document.getElementById('spellingResult').textContent=isCorrect?'✓ 正确！':'✗ 错误';document.getElementById('spellingCorrectAnswer').textContent=isCorrect?'':'正确答案：'+w.word;fb.style.display='block';}
function spellingHint(){const w=spellingWords[spellingIndex];const input=document.getElementById('spellingInput');if(spellingHintCount<w.word.length){input.value=w.word.substring(0,spellingHintCount+1);spellingHintCount++;input.focus();}}
function nextSpellingWord(){spellingIndex++;if(spellingIndex>=spellingWords.length)showReviewResult('spelling');else loadSpellingWord();}

// Review Result
function showReviewResult(mode){const panel=document.getElementById('reviewResult');['flashcardPanel','quizPanel','spellingPanel'].forEach(id=>document.getElementById(id).style.display='none');panel.style.display='block';let results,modeLabel;if(mode==='flashcard'){results=fcResults;modeLabel='闪卡练习';}else if(mode==='quiz'){results=quizResults;modeLabel='选择题测验';}else{results=spellingResults;modeLabel='拼写测试';}const correct=results.filter(r=>r.correct).length;const total=results.length;const pct=Math.round(correct/total*100);document.getElementById('resultIcon').textContent=pct>=80?'🎉':pct>=60?'👍':'💪';document.getElementById('resultTitle').textContent=`${modeLabel}完成！`;document.getElementById('resultScore').textContent=`${correct}/${total}`;document.getElementById('resultDetail').innerHTML=`正确率 <strong>${pct}%</strong><br>${pct>=80?'太棒了！继续保持！':pct>=60?'还不错，继续努力！':'加油，多复习几次就会更好！'}`;document.getElementById('resultWords').innerHTML=results.map(r=>`<span class="result-word-tag ${r.correct?'correct':'wrong'}">${r.word}</span>`).join('');document.getElementById('restartBtn').textContent='再来一轮';}
function addToErrors(w,source){const existing=errorWords.find(e=>e.word===w.word);if(existing){existing.errorCount++;existing.lastError='今天';}else{errorWords.push({word:w.word,phonetic:w.phonetic,meaning:w.meaning,source:source==='flashcard'?'quiz':source,errorCount:1,lastError:'今天'});}saveData();}

let pendingUploadData=null;
function showUploadModal(){document.getElementById('uploadModalOverlay').classList.add('show');}
function closeUploadModal(){document.getElementById('uploadModalOverlay').classList.remove('show');document.getElementById('uploadPreview').style.display='none';document.getElementById('uploadPreview').innerHTML='';document.getElementById('fileInput').value='';document.getElementById('uploadConfirmBtn').disabled=true;pendingUploadData=null;}
function handleFileUpload(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){const content=e.target.result;try{let data;if(file.name.endsWith('.json')){data=JSON.parse(content);}else if(file.name.endsWith('.csv')){data=parseCSV(content);}else{showToast('不支持的文件格式');return;}if(!Array.isArray(data)||data.length===0){showToast('文件内容为空或格式不正确');return;}pendingUploadData=data;const preview=document.getElementById('uploadPreview');preview.style.display='block';preview.innerHTML=`<div style="padding:16px;background:var(--bg-page);border-radius:var(--radius-md)"><div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:8px">✅ 解析成功！共 ${data.length} 个单词</div><div style="max-height:200px;overflow-y:auto">${data.slice(0,10).map(w=>`<div style="padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px"><strong>${w.word||'?'}</strong> <span style="color:var(--text-tertiary)">${w.phonetic||''}</span> — ${w.meaning||''}</div>`).join('')}${data.length>10?`<div style="padding:6px 0;font-size:12px;color:var(--text-tertiary)">...还有 ${data.length-10} 个单词</div>`:''}</div></div>`;document.getElementById('uploadConfirmBtn').disabled=false;}catch(err){showToast('文件解析失败：'+err.message);}};reader.readAsText(file);}
function parseCSV(text){const lines=text.trim().split('\\n');const headers=lines[0].split(',').map(h=>h.trim().toLowerCase());return lines.slice(1).map(line=>{const vals=line.split(',');const obj={};headers.forEach((h,i)=>obj[h]=vals[i]?.trim()||'');return obj;}).filter(o=>o.word);}
function confirmUpload(){if(!pendingUploadData)return;const newBook={title:'自定义词书 '+(books.length+1),desc:'上传导入 · '+pendingUploadData.length+' 词',cover:'c'+((books.length%6)+1),emoji:'📋',progress:0,meta:'未开始 · '+pendingUploadData.length+' 词'};books.push(newBook);bookWordsData.push({title:newBook.title,desc:newBook.desc,cover:newBook.cover,emoji:newBook.emoji,progress:0,totalWords:pendingUploadData.length,learnedWords:0,currentChapter:'未开始',words:pendingUploadData.map(w=>({word:w.word||'',phonetic:w.phonetic||'',meaning:w.meaning||'',example:w.example||'',learned:false}))});document.getElementById('bookGrid').innerHTML=books.map((b,i)=>`<div class="book-card" onclick="openBook(${i})"><div class="book-cover ${b.cover}">${b.emoji}<div class="book-progress-bar"><div class="book-progress-bar-fill" style="width:${b.progress}%"></div></div></div><div class="book-body"><div class="book-title">${b.title}</div><div class="book-desc">${b.desc}</div><div class="book-meta"><span class="book-meta-left">${b.meta}</span><span class="book-meta-right">${b.progress}%</span></div></div></div>`).join('');closeUploadModal();saveData();showToast('词书导入成功！共 '+pendingUploadData.length+' 个单词');}

{id:0,title:'The Art of Slow Reading',level:'easy',levelLabel:'初级',topic:'culture',topicLabel:'文化',excerpt:'In a world of information overload, slow reading is making a comeback. Researchers have found that taking time to read deeply improves comprehension and empathy...',wordCount:280,readTime:'3 min',read:false,vocab:[{w:'overload',m:'n. 过载'},{w:'empathy',m:'n. 共情'},{w:'comprehension',m:'n. 理解力'}],content:'<p>In a world of information overload, slow reading is making a comeback. Researchers have found that taking time to read deeply improves comprehension and empathy.</p><p>The practice of slow reading involves setting aside dedicated time, free from distractions, to fully engage with a text. Unlike skimming or scanning, slow reading encourages readers to reflect on the material, make connections, and form their own opinions.</p><p>Studies show that people who practice slow reading retain information better and develop stronger analytical skills. It also reduces stress, as the focused attention required creates a meditative state similar to mindfulness practice.</p>',questions:[{q:'According to the passage, what is slow reading?',o:['Quickly scanning a text for key points','Taking time to read deeply and reflect','Reading aloud slowly','Reading only short texts'],a:1},{q:'What benefit of slow reading is mentioned?',o:['Improves typing speed','Reduces stress','Increases reading speed','Helps with spelling'],a:1}]},
{id:1,title:'Climate Change and Urban Planning',level:'medium',levelLabel:'中级',topic:'world',topicLabel:'国际',excerpt:'As global temperatures rise, cities around the world are rethinking their infrastructure. From green roofs to permeable pavements, urban planners are embracing innovative solutions...',wordCount:320,readTime:'4 min',read:false,vocab:[{w:'infrastructure',m:'n. 基础设施'},{w:'permeable',m:'adj. 可渗透的'},{w:'innovative',m:'adj. 创新的'}],content:'<p>As global temperatures rise, cities around the world are rethinking their infrastructure. From green roofs to permeable pavements, urban planners are embracing innovative solutions to combat the effects of climate change.</p><p>Copenhagen, for example, has developed a comprehensive cloudburst management plan that includes building parks designed to flood during heavy rain, channeling water away from vulnerable neighborhoods. Singapore has integrated nature into its urban fabric with "biophilic" design, creating vertical forests and rooftop gardens.</p><p>These approaches not only help cities adapt to climate change but also improve quality of life for residents. The key challenge, however, is funding these ambitious projects, especially in developing nations where resources are limited.</p>',questions:[{q:'What is Copenhagen\'s approach to heavy rain?',o:['Building larger drainage pipes','Creating parks that can flood','Raising buildings above ground','Installing more pumps'],a:1},{q:'What is the main challenge mentioned?',o:['Lack of technology','Funding ambitious projects','Public opposition','Shortage of materials'],a:1}]},
{id:2,title:'The Future of Quantum Computing',level:'hard',levelLabel:'高级',topic:'tech',topicLabel:'科技',excerpt:'Quantum computing promises to revolutionize everything from drug discovery to cryptography. Unlike classical computers that use binary bits, quantum computers use qubits...',wordCount:340,readTime:'5 min',read:false,vocab:[{w:'cryptography',m:'n. 密码学'},{w:'qubit',m:'n. 量子比特'},{w:'superposition',m:'n. 叠加态'}],content:'<p>Quantum computing promises to revolutionize everything from drug discovery to cryptography. Unlike classical computers that use binary bits, quantum computers use qubits, which can exist in multiple states simultaneously through a phenomenon called superposition.</p><p>This property, combined with entanglement—the ability of qubits to be correlated even when separated—allows quantum computers to perform certain calculations exponentially faster than classical machines. For instance, factoring large numbers, which underpins modern encryption, could be done in minutes rather than millennia.</p><p>However, quantum computers are notoriously fragile. Qubits must be maintained at temperatures near absolute zero, and even minor interference can cause decoherence, destroying the quantum state. Researchers are making steady progress, but practical quantum computers may still be years away.</p>',questions:[{q:'What is superposition?',o:['When qubits are separated','When qubits exist in multiple states at once','When qubits lose their state','When qubits are too hot'],a:1},{q:'What causes decoherence?',o:['High temperatures only','Minor interference with qubits','Too many calculations','Binary bit contamination'],a:1}]},
{id:3,title:'The Psychology of Habit Formation',level:'medium',levelLabel:'中级',topic:'culture',topicLabel:'文化',excerpt:'Habits shape our daily lives more than we realize. Research shows that about 40% of our daily actions are not conscious decisions but habits...',wordCount:290,readTime:'4 min',read:false,vocab:[{w:'consciously',m:'adv. 有意识地'},{w:'cue',m:'n. 线索，提示'},{w:'neurological',m:'adj. 神经的'}],content:'<p>Habits shape our daily lives more than we realize. Research shows that about 40% of our daily actions are not conscious decisions but habits formed through repetition.</p><p>The habit loop consists of three components: a cue that triggers the behavior, the routine itself, and the reward that reinforces it. Understanding this loop is key to both breaking bad habits and building good ones.</p><p>Studies in neuroscience reveal that habits are stored in the basal ganglia, a deep brain structure. This explains why habits persist even when we consciously want to change them—the neurological pathways are simply too strong.</p>',questions:[{q:'What percentage of daily actions are habits?',o:['About 20%','About 40%','About 60%','About 80%'],a:1},{q:'Where are habits stored in the brain?',o:['The cortex','The basal ganglia','The hippocampus','The cerebellum'],a:1}]},
{id:4,title:'Global Supply Chain Disruptions',level:'hard',levelLabel:'高级',topic:'business',topicLabel:'商业',excerpt:'The pandemic exposed the fragility of global supply chains. Companies that once relied on just-in-time manufacturing are now rethinking their strategies...',wordCount:310,readTime:'5 min',read:false,vocab:[{w:'fragility',m:'n. 脆弱性'},{w:'resilient',m:'adj. 有韧性的'},{w:'diversification',m:'n. 多样化'}],content:'<p>The pandemic exposed the fragility of global supply chains. Companies that once relied on just-in-time manufacturing are now rethinking their strategies, shifting toward resilience and redundancy.</p><p>Many firms are diversifying their supplier base, moving production closer to home, and building larger inventory buffers. This trend, known as "nearshoring" or "reshoring," represents a fundamental shift in how businesses manage risk.</p><p>However, building resilient supply chains comes at a cost. Companies must balance efficiency with redundancy, and consumers may face higher prices as a result. The challenge lies in finding the right equilibrium between cost optimization and risk mitigation.</p>',questions:[{q:'What is nearshoring?',o:['Moving production closer to home','Buying cheaper materials','Using fewer suppliers','Increasing production speed'],a:0},{q:'What is the trade-off of resilient supply chains?',o:['Lower quality','Higher prices','Slower delivery','Fewer products'],a:1}]},

function checkReadingAnswer(qi,oi,articleId){const q=readingArticles[articleId].questions[qi];const opts=document.querySelectorAll(`#readingQ-${qi} .reading-q-option`);opts.forEach(o=>o.style.pointerEvents='none');if(oi===q.a){opts[oi].classList.add('correct');showToast('✓ 回答正确！');}else{opts[oi].classList.add('wrong');opts[q.a].classList.add('correct');showToast('✗ 正确答案：'+q.o[q.a]);}}

function startListening(i){currentListeningIndex=i;const ex=listeningExercises[i];const c=document.getElementById('listeningContent');const fillText=ex.script.replace(new RegExp(ex.blanks.map(b=>b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g'),match=>`<input class="listening-input" data-correct="${match.toLowerCase()}" placeholder="?" style="width:${match.length*10+30}px">`);c.innerHTML=`<div class="listening-player"><button class="listening-play-btn" onclick="playListening()">▶</button><div style="font-size:16px;font-weight:700">${ex.title}</div><div class="listening-status" id="listeningStatus">点击播放开始听力</div></div><div class="card" style="margin-top:20px"><div class="card-header"><div class="card-title">听写填空</div><button class="btn btn-ghost" onclick="checkListeningFill()">检查填空</button></div><div class="listening-fill"><div class="listening-fill-text">${fillText}</div></div></div><div class="card" style="margin-top:20px"><div class="card-header"><div class="card-title">理解选择题</div></div>${ex.questions.map((q,qi)=>`<div class="reading-question"><div class="reading-q-title">${qi+1}. ${q.q}</div><div class="reading-q-options" id="listeningQ-${qi}">${q.o.map((opt,oi)=>`<div class="reading-q-option" onclick="checkListeningQ(${qi},${oi})">${opt}</div>`).join('')}</div></div>`).join('')}</div><div style="text-align:center;margin-top:20px"><button class="btn btn-ghost" onclick="renderListening()">← 返回列表</button></div>`;}
function playListening(){const ex=listeningExercises[currentListeningIndex];const status=document.getElementById('listeningStatus');if(status)status.textContent='正在播放...';speak(ex.script);if(status)setTimeout(()=>status.textContent='播放完毕，请完成练习',ex.script.length*80+2000);}
function checkListeningFill(){const inputs=document.querySelectorAll('.listening-input');let correct=0,total=0;inputs.forEach(inp=>{total++;const answer=inp.value.trim().toLowerCase();const correctVal=inp.dataset.correct;if(answer===correctVal){inp.style.borderColor='var(--accent-emerald)';inp.style.color='var(--accent-emerald-dark)';correct++;}else{inp.style.borderColor='var(--accent-rose)';inp.style.color='var(--accent-rose)';inp.value=inp.value+' → '+correctVal;}});showToast(`填空正确率：${correct}/${total}`);}
function checkListeningQ(qi,oi){const ex=listeningExercises[currentListeningIndex];const q=ex.questions[qi];const opts=document.querySelectorAll(`#listeningQ-${qi} .reading-q-option`);opts.forEach(o=>o.style.pointerEvents='none');if(oi===q.a){opts[oi].classList.add('correct');}else{opts[oi].classList.add('wrong');opts[q.a].classList.add('correct');}}

{id:0,icon:'🔄',iconBg:'#FEF3C7',color:'#92400E',title:'一般现在时 vs 现在进行时',desc:'区分两种最基本的时态用法',rules:['<strong>一般现在时</strong>：表示习惯性、永久性的动作或客观真理。例：The sun rises in the east.','<strong>现在进行时</strong>：表示此刻正在进行的动作或近期趋势。例：She is studying for her exam right now.','<strong>关键区别</strong>：一般现在时强调"经常性"，现在进行时强调"暂时性"。'],examples:['I work at a bank. (永久性工作)','I am working on a new project. (临时任务)'],exercise:{q:'Choose: "She usually ___ coffee, but today she ___ tea."',o:['drinks / drinks','drinks / is drinking','is drinking / drinks','is drinking / is drinking'],a:1}},

function renderGrammar(){const c=document.getElementById('grammarList');if(!c)return;c.innerHTML=grammarTopics.map((g,i)=>`<div class="grammar-topic" id="grammar-${i}"><div class="grammar-topic-header" onclick="toggleGrammar(${i})"><div class="grammar-topic-icon" style="background:${g.iconBg};color:${g.color}">${g.icon}</div><div style="flex:1"><div class="grammar-topic-title">${g.title}</div><div class="grammar-topic-desc">${g.desc}</div></div><span style="font-size:14px;color:var(--text-tertiary)">▼</span></div><div class="grammar-topic-body"><div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:10px">语法规则</div>${g.rules.map(r=>`<div class="grammar-rule">${r}</div>`).join('')}<div style="font-size:13px;font-weight:600;color:var(--text-primary);margin:16px 0 10px">例句</div>${g.examples.map(e=>`<div class="grammar-example">${e}</div>`).join('')}<div style="font-size:13px;font-weight:600;color:var(--text-primary);margin:16px 0 10px">随堂练习</div><div class="reading-question"><div class="reading-q-title">${g.exercise.q}</div><div class="reading-q-options" id="grammarQ-${i}">${g.exercise.o.map((opt,oi)=>`<div class="reading-q-option" onclick="checkGrammarAnswer(${i},${oi})">${opt}</div>`).join('')}</div></div></div></div>`).join('');}
function toggleGrammar(i){const el=document.getElementById('grammar-'+i);if(el)el.classList.toggle('expanded');}
function checkGrammarAnswer(topicId,oi){const g=grammarTopics[topicId];const opts=document.querySelectorAll(`#grammarQ-${topicId} .reading-q-option`);opts.forEach(o=>o.style.pointerEvents='none');if(oi===g.exercise.a){opts[oi].classList.add('correct');showToast('✓ 回答正确！');}else{opts[oi].classList.add('wrong');opts[g.exercise.a].classList.add('correct');showToast('✗ 正确答案：'+g.exercise.o[g.exercise.a]);}}

let currentNewsFilter='all';
function getAllNews(){let daily=(window.DAILY_NEWS&&Array.isArray(window.DAILY_NEWS))?window.DAILY_NEWS.map((a,i)=>{a._daily=true;a.id=1000+i;return a;}):[];return [...daily,...newsArticles];}
function renderNews(){const c=document.getElementById('newsList');if(!c)return;const all=getAllNews();const filtered=currentNewsFilter==='all'?all:all.filter(a=>a.category===currentNewsFilter);if(filtered.length===0){c.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-tertiary)">暂无新闻</div>';return;}c.innerHTML=filtered.map(a=>{const badge=a._daily?'<span style="display:inline-block;padding:2px 6px;background:var(--accent-emerald-light);color:var(--accent-emerald-dark);border-radius:4px;font-size:10px;font-weight:600;margin-left:6px">每日热点</span>':'';return `<div class="news-card" onclick="openNews(${a.id})"><div class="news-card-header"><div class="news-thumb book-cover ${a.thumb||'c1'}">${a.emoji||'📰'}</div><div class="news-card-body"><div class="news-card-title">${a.title}${badge}</div><div class="news-card-excerpt">${a.excerpt}</div><div class="news-card-meta"><span class="news-source">${a.source}</span><span>📖 ${a.wordCount} 词</span><span>⏱ ${a.readTime}</span><span class="reading-tag topic">${a.categoryLabel}</span></div></div></div></div>`;}).join('');updateNewsTimestamp();}
function updateNewsTimestamp(){const el=document.getElementById('newsUpdatedAt');if(!el)return;if(window.DAILY_NEWS_UPDATED){el.textContent='📅 更新于 '+window.DAILY_NEWS_UPDATED;}else{el.textContent='';}}
function refreshDailyNews(){showToast('正在刷新新闻...');const s=document.createElement('script');s.src='daily_news.js?t='+Date.now();s.onload=function(){renderNews();showToast('新闻已刷新！'+(window.DAILY_NEWS_COUNT?('共 '+window.DAILY_NEWS_COUNT+' 篇'):''));};s.onerror=function(){showToast('刷新失败，请稍后重试');};document.head.appendChild(s);}
function filterNews(btn,filter){btn.parentElement.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentNewsFilter=filter;renderNews();}
function openNews(id){const all=getAllNews();const a=all.find(x=>x.id===id)||newsArticles[id];if(!a)return;document.getElementById('newsDetailContent').innerHTML=`<div class="reading-article-header"><span class="reading-tag topic">${a.categoryLabel}</span><span class="news-source">${a.source}</span>${a.link?`<a href="${a.link}" target="_blank" style="font-size:12px;color:var(--accent-blue);margin-left:8px">查看原文 ↗</a>`:''}</div><h2 style="font-size:24px;font-weight:800;color:var(--text-primary);margin-bottom:8px">${a.title}</h2><div class="reading-meta" style="margin-bottom:20px"><span>📖 ${a.wordCount} 词</span><span>⏱ ${a.readTime}</span></div><div class="reading-content">${a.content}</div><div class="reading-vocab"><div class="reading-vocab-title">重点词汇</div>${(a.vocab||[]).map(v=>`<div class="reading-vocab-item"><strong style="color:var(--accent-amber-dark)">${v.w}</strong><span style="color:var(--text-secondary)">${v.m}</span><button class="tts-btn" onclick="speak('${v.w}')" style="margin-left:auto">🔊</button></div>`).join('')}</div><div style="text-align:center;margin-top:24px"><button class="btn btn-primary" onclick="speak('${a.title.replace(/'/g,"\\'")}')">🔊 朗读标题</button></div>`;switchPage('news-detail');document.getElementById('pageTitle').textContent='新闻：'+a.title;}

// ===== localStorage Persistence =====
let autoSave=true;
function saveData(){if(!autoSave)return;const data={errorWords,books,bookWordsData,savedDate:new Date().toISOString(),version:'2.0'};try{localStorage.setItem('englishLearningData',JSON.stringify(data));if(typeof updateUserLevel==='function')updateUserLevel();}catch(e){console.warn('Save failed:',e);}}
function loadData(){try{const raw=localStorage.getItem('englishLearningData');if(!raw)return;const data=JSON.parse(raw);if(data.version!=='2.0'){localStorage.removeItem('englishLearningData');localStorage.removeItem('englishNotes');localStorage.removeItem('englishFavorites');console.log('旧数据已清除（版本升级）');return;}if(data.errorWords)errorWords=data.errorWords;if(data.books)books=data.books;if(data.bookWordsData)bookWordsData=data.bookWordsData;}catch(e){console.warn('Load failed:',e);}}
function exportData(){const data={errorWords,books,bookWordsData,exportDate:new Date().toISOString(),version:'2.0'};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='英语学习数据_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);showToast('数据已导出！');}
function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){try{const data=JSON.parse(e.target.result);if(data.errorWords)errorWords=data.errorWords;if(data.books)books=data.books;if(data.bookWordsData)bookWordsData=data.bookWordsData;saveData();renderErrors('all');document.getElementById('bookGrid').innerHTML=books.map((b,i)=>`<div class="book-card" onclick="openBook(${i})"><div class="book-cover ${b.cover}">${b.emoji}<div class="book-progress-bar"><div class="book-progress-bar-fill" style="width:${b.progress}%"></div></div></div><div class="book-body"><div class="book-title">${b.title}</div><div class="book-desc">${b.desc}</div><div class="book-meta"><span class="book-meta-left">${b.meta}</span><span class="book-meta-right">${b.progress}%</span></div></div></div>`).join('');showToast('数据导入成功！');}catch(err){showToast('导入失败：'+err.message);}};reader.readAsText(file);}
function clearAllData(){if(!confirm('确定要清除所有学习数据吗？此操作不可恢复！'))return;localStorage.removeItem('englishLearningData');location.reload();}
function toggleAutoSave(){const t=document.getElementById('autoSaveToggle');autoSave=t?t.checked:true;showToast(autoSave?'自动保存已开启':'自动保存已关闭');}

// ===== User Name & Level =====
function loadUserName(){try{const name=localStorage.getItem('englishUserName')||'学习者';const avatarEl=document.getElementById('sidebarAvatar');const nameEl=document.getElementById('sidebarUserName');const inputEl=document.getElementById('userNameInput');if(avatarEl)avatarEl.textContent=name.charAt(0);if(nameEl)nameEl.textContent=name;if(inputEl)inputEl.value=name;updateUserLevel();}catch(e){}}
function saveUserName(){const input=document.getElementById('userNameInput');if(!input)return;const name=input.value.trim()||'学习者';localStorage.setItem('englishUserName',name);const avatarEl=document.getElementById('sidebarAvatar');const nameEl=document.getElementById('sidebarUserName');if(avatarEl)avatarEl.textContent=name.charAt(0);if(nameEl)nameEl.textContent=name;showToast('用户名已保存：'+name);}
function getTotalLearnedWords(){let total=0;if(typeof bookWordsData!=='undefined'&&Array.isArray(bookWordsData)){bookWordsData.forEach(b=>{if(b.words&&Array.isArray(b.words)){total+=b.words.filter(w=>w.learned).length;}});}return total;}
function getUserLevel(total){if(total>=3000)return{level:7,name:'大师'};if(total>=2000)return{level:6,name:'专家'};if(total>=1000)return{level:5,name:'高级者'};if(total>=500)return{level:4,name:'熟练者'};if(total>=200)return{level:3,name:'进阶者'};if(total>=50)return{level:2,name:'入门者'};return{level:1,name:'初学者'};}
function updateUserLevel(){const total=getTotalLearnedWords();const lv=getUserLevel(total);const text='Level '+lv.level+' · '+lv.name;const levelEl=document.getElementById('sidebarUserLevel');const dispEl=document.getElementById('userLevelDisplay');if(levelEl)levelEl.textContent=text;if(dispEl)dispEl.textContent=text;}

let syncTimer=null;let syncIntervalSec=300;let syncSettings={vault:'Obsidian Vault',basePath:'03-个人成长/技能树/英语学习',report:true,notes:true,errors:true,favs:true,interval:300};

function loadSyncSettings(){try{const s=localStorage.getItem('englishSyncSettings');if(s){syncSettings=JSON.parse(s);syncIntervalSec=syncSettings.interval||300;}}catch(e){}}

function setSyncInterval(btn){document.querySelectorAll('.sync-interval-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');syncIntervalSec=parseInt(btn.dataset.interval);saveSyncSettings();if(syncTimer){clearInterval(syncTimer);syncTimer=null;if(syncIntervalSec>0){syncTimer=setInterval(syncAllToObsidian,syncIntervalSec*1000);}}showToast('同步频率: '+(syncIntervalSec===0?'手动':syncIntervalSec>=60?(syncIntervalSec/60)+' 分钟':'实时'));}

function addSyncLog(msg,type){const log=document.getElementById('syncLog');if(!log)return;const entry=document.createElement('div');entry.className='sync-log-entry '+(type||'');const now=new Date();const ts=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');entry.textContent='['+ts+'] '+msg;log.insertBefore(entry,log.firstChild);while(log.children.length>20)log.removeChild(log.lastChild);}

function updateSyncStatus(status){const dot=document.getElementById('syncStatusDot');const text=document.getElementById('syncStatusText');const badge=document.getElementById('syncBadge');const time=document.getElementById('syncLastTime');if(!dot)return;if(status==='active'){dot.className='sync-status-dot active';text.textContent='自动同步运行中 · '+(syncIntervalSec>=60?(syncIntervalSec/60)+'分钟':'实时');badge.textContent='已连接';badge.style.color='#10B981';}else if(status==='syncing'){dot.className='sync-status-dot syncing';text.textContent='正在同步...';badge.textContent='同步中';badge.style.color='#F59E0B';}else{dot.className='sync-status-dot';text.textContent='自动同步未开启';badge.textContent='未连接';badge.style.color='var(--text-tertiary)';}const now=new Date();if(time)time.textContent='上次同步: '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');}

function triggerObsidianURI(filePath,content){const vault=syncSettings.vault||'Obsidian Vault';const uri='obsidian://new?vault='+encodeURIComponent(vault)+'&file='+encodeURIComponent(filePath)+'&content='+encodeURIComponent(content);const iframe=document.createElement('iframe');iframe.style.display='none';iframe.src=uri;document.body.appendChild(iframe);setTimeout(()=>{document.body.removeChild(iframe);},3000);}

function toggleObsidianSync(){const t=document.getElementById('obsidianSyncToggle');if(!t)return;saveSyncSettings();if(t.checked){if(syncIntervalSec>0){syncTimer=setInterval(syncAllToObsidian,syncIntervalSec*1000);}updateSyncStatus('active');addSyncLog('自动同步已开启，频率: '+(syncIntervalSec>=60?(syncIntervalSec/60)+'分钟':'实时'),'success');showToast('Obsidian 自动同步已开启');window.addEventListener('beforeunload',syncAllToObsidian);}else{if(syncTimer){clearInterval(syncTimer);syncTimer=null;}updateSyncStatus('inactive');addSyncLog('自动同步已关闭');showToast('Obsidian 自动同步已关闭');}}

function syncAllToObsidian(){if(document.getElementById('syncReport')&&document.getElementById('syncReport').checked)syncDailyReportToObsidian();if(document.getElementById('syncNotes')&&document.getElementById('syncNotes').checked)syncNotesToObsidian();if(document.getElementById('syncErrors')&&document.getElementById('syncErrors').checked)syncErrorsToObsidian();if(document.getElementById('syncFavs')&&document.getElementById('syncFavs').checked)syncFavoritesToObsidian();updateSyncStatus('active');}

function syncDailyReportToObsidian(){updateSyncStatus('syncing');const now=new Date();const dateStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');const days=['日','一','二','三','四','五','六'];const basePath=syncSettings.basePath||'03-个人成长/技能树/英语学习';let totalLearned=0,totalTarget=0;(bookWordsData||[]).forEach(b=>{totalLearned+=b.learnedWords||0;totalTarget+=b.totalWords||0;});if(totalLearned===0){books.forEach(b=>{const m=b.meta.match(/([\d,]+)\/([\d,]+)/);if(m){totalLearned+=parseInt(m[1].replace(/,/g,''));totalTarget+=parseInt(m[2].replace(/,/g,''));}});}const errorCount=errorWords.length;const noteCount=notes.length;const favCount=favorites.length;let md='---\ntitle: 英语学习日报\ndate: '+dateStr+'\ntags: [英语学习, 学习日报, 自动同步]\ncreated: '+now.toISOString()+'\n---\n\n';md+='# 📖 英语学习日报 '+dateStr+' 周'+days[now.getDay()]+'\n\n';md+='## 今日学习概况\n\n| 指标 | 数值 |\n|------|------|\n';md+='| 累计掌握单词 | '+totalLearned.toLocaleString()+' |\n';md+='| 词书目标总数 | '+totalTarget.toLocaleString()+' |\n';md+='| 学习进度 | '+(totalTarget>0?(totalLearned/totalTarget*100).toFixed(1):0)+'% |\n';md+='| 错题本单词 | '+errorCount+' |\n';md+='| 学习笔记 | '+noteCount+' 条 |\n';md+='| 收藏单词 | '+favCount+' |\n';md+='| 同步时间 | '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+' |\n\n';md+='## 词书进度\n\n| 词书 | 进度 | 已学/总数 |\n|------|------|-----------|\n';(bookWordsData||[]).forEach(b=>{md+='| '+(b.emoji||'📘')+' '+(b.title||'')+' | '+(b.progress||0)+'% | '+(b.learnedWords||0)+'/'+(b.totalWords||0)+' |\n';});books.forEach(b=>{md+='| '+b.emoji+' '+b.title+' | '+b.progress+'% | '+b.meta+' |\n';});if(errorWords.length>0){md+='\n## 错题本 ('+errorWords.length+' 词)\n\n| 错题词 | 释义 | 来源 | 错误次数 | 最近错误 |\n|--------|------|------|----------|----------|\n';errorWords.forEach(e=>{md+='| [['+e.word+']] | '+e.meaning+' | '+(e.source==='quiz'?'测验':'拼写')+' | '+e.errorCount+' | '+e.lastError+' |\n';});}if(notes.length>0){md+='\n## 最近笔记\n\n';notes.slice(0,5).forEach(n=>{md+='- **'+n.content.slice(0,60)+(n.content.length>60?'...':'')+'** ('+n.date+')\n';});}if(favorites.length>0){md+='\n## 收藏单词 ('+favorites.length+')\n\n';favorites.slice(0,10).forEach(f=>{md+='- [['+f.word+']] '+f.phonetic+' — '+f.meaning+'\n';});if(favorites.length>10)md+='- ...还有 '+(favorites.length-10)+' 个\n';}md+='\n## 学习反思\n\n<!-- 在此记录今天的学习心得和明日计划 -->\n\n## 明日计划\n\n- [ ] 继续学习雅思核心词汇\n- [ ] 复习今日错题 ('+errorCount+' 词)\n- [ ] 阅读理解 1 篇\n- [ ] 听力练习 1 组\n\n---\n> 💡 本报告由英语学习平台自动生成于 '+dateStr+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+'\n\n[[英语学习看板]] | [[英语学习]]\n';const filePath=basePath+'/01-学习日志/'+dateStr+'-英语学习日报';triggerObsidianURI(filePath,md);addSyncLog('日报已同步 → 01-学习日志/'+dateStr+'-英语学习日报','success');showToast('日报已同步到 Obsidian');updateSyncStatus('active');}

function syncNotesToObsidian(){if(notes.length===0){addSyncLog('无笔记需要同步');return;}updateSyncStatus('syncing');const basePath=syncSettings.basePath||'03-个人成长/技能树/英语学习';const tagLabels={word:'单词笔记',expression:'表达笔记',grammar:'语法笔记',reading:'阅读笔记'};let md='---\ntitle: 学习笔记汇总\ndate: '+new Date().toISOString().slice(0,10)+'\ntags: [英语学习, 学习笔记, 自动同步]\n---\n\n# 📝 学习笔记汇总\n\n';md+='> 共 '+notes.length+' 条笔记 · 最后更新: '+new Date().toLocaleString('zh-CN')+'\n\n';const grouped={};notes.forEach(n=>{if(!grouped[n.tag])grouped[n.tag]=[];grouped[n.tag].push(n);});Object.keys(grouped).forEach(tag=>{md+='## '+(tagLabels[tag]||'笔记')+' ('+grouped[tag].length+')\n\n';grouped[tag].forEach(n=>{md+='### '+n.date+'\n\n'+n.content+'\n\n';});});md+='---\n> 由英语学习平台自动同步\n\n[[英语学习看板]]\n';triggerObsidianURI(basePath+'/学习笔记汇总',md);addSyncLog('笔记已同步 ('+notes.length+' 条)','success');updateSyncStatus('active');}

function syncErrorsToObsidian(){if(errorWords.length===0){addSyncLog('无错题需要同步');return;}updateSyncStatus('syncing');const basePath=syncSettings.basePath||'03-个人成长/技能树/英语学习';let md='---\ntitle: 错题本\ndate: '+new Date().toISOString().slice(0,10)+'\ntags: [英语学习, 错题本, 自动同步]\n---\n\n# ❌ 错题本\n\n> 共 '+errorWords.length+' 个错题 · 最后更新: '+new Date().toLocaleString('zh-CN')+'\n\n';md+='| 单词 | 音标 | 释义 | 来源 | 错误次数 | 最近错误 |\n|------|------|------|------|----------|----------|\n';errorWords.sort((a,b)=>(b.errorCount||0)-(a.errorCount||0));errorWords.forEach(e=>{md+='| [['+e.word+']] | — | '+e.meaning+' | '+(e.source==='quiz'?'测验':'拼写')+' | '+(e.errorCount||1)+' | '+(e.lastError||'—')+' |\n';});md+='\n---\n> 由英语学习平台自动同步\n\n[[英语学习看板]]\n';triggerObsidianURI(basePath+'/错题本',md);addSyncLog('错题本已同步 ('+errorWords.length+' 词)','success');updateSyncStatus('active');}

function syncFavoritesToObsidian(){if(favorites.length===0){addSyncLog('无收藏需要同步');return;}updateSyncStatus('syncing');const basePath=syncSettings.basePath||'03-个人成长/技能树/英语学习';let md='---\ntitle: 收藏单词\ndate: '+new Date().toISOString().slice(0,10)+'\ntags: [英语学习, 收藏, 自动同步]\n---\n\n# ⭐ 收藏单词\n\n> 共 '+favorites.length+' 个单词 · 最后更新: '+new Date().toLocaleString('zh-CN')+'\n\n';md+='| # | 单词 | 音标 | 释义 |\n|---|------|------|------|\n';favorites.forEach((f,i)=>{md+='| '+i+1+' | [['+f.word+']] | '+(f.phonetic||'—')+' | '+(f.meaning||'—')+' |\n';});md+='\n---\n> 由英语学习平台自动同步\n\n[[英语学习看板]]\n';triggerObsidianURI(basePath+'/收藏单词',md);addSyncLog('收藏已同步 ('+favorites.length+' 词)','success');updateSyncStatus('active');}

function downloadReport(){const now=new Date();const dateStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');const days=['日','一','二','三','四','五','六'];let totalLearned=0;(bookWordsData||[]).forEach(b=>{totalLearned+=b.learnedWords||0;});if(totalLearned===0){books.forEach(b=>{const m=b.meta.match(/([\d,]+)\/([\d,]+)/);if(m)totalLearned+=parseInt(m[1].replace(/,/g,''));});}let md='---\ntitle: 英语学习日报\ndate: '+dateStr+'\ntags: [英语学习, 学习日报]\n---\n\n# 📖 英语学习日报 '+dateStr+' 周'+days[now.getDay()]+'\n\n## 今日学习概况\n\n| 指标 | 数值 |\n|------|------|\n';md+='| 累计掌握单词 | '+totalLearned.toLocaleString()+' |\n';md+='| 错题本单词 | '+errorWords.length+' |\n';md+='| 学习笔记 | '+notes.length+' 条 |\n';md+='| 收藏单词 | '+favorites.length+' |\n\n';md+='## 词书进度\n\n| 词书 | 进度 | 已学/总数 |\n|------|------|-----------|\n';(bookWordsData||[]).forEach(b=>{md+='| '+(b.title||'')+' | '+(b.progress||0)+'% | '+(b.learnedWords||0)+'/'+(b.totalWords||0)+' |\n';});books.forEach(b=>{md+='| '+b.title+' | '+b.progress+'% | '+b.meta+' |\n';});md+='\n[[英语学习看板]] | [[英语学习]]\n';const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=dateStr+'_英语学习日报.md';a.click();URL.revokeObjectURL(url);showToast('报告已下载！');}

// ===== Notes =====
let notes=[];
function addNote(){const input=document.getElementById('noteInput');const tagSelect=document.getElementById('noteTagSelect');if(!input.value.trim()){showToast('请输入笔记内容');return;}const now=new Date();const dateStr=(now.getMonth()+1)+'月'+now.getDate()+'日';notes.unshift({tag:tagSelect.value,content:input.value.trim(),date:dateStr});input.value='';renderNotes();saveNotes();showToast('笔记已保存');}
function renderNotes(){const c=document.getElementById('notesList');if(!c)return;const tagLabels={word:'单词笔记',expression:'表达笔记',grammar:'语法笔记',reading:'阅读笔记'};const total=document.getElementById('noteCount');if(total)total.textContent=notes.length;if(notes.length===0){c.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-tertiary);font-size:14px">还没有笔记，开始记录你的学习心得吧！</div>';return;}c.innerHTML=notes.map((n,i)=>`<div class="note-card"><div class="note-header"><span class="note-tag ${n.tag}">${tagLabels[n.tag]||'笔记'}</span><span class="note-date">${n.date}</span></div><div class="note-content">${n.content}</div><div class="note-actions"><button class="btn btn-ghost" onclick="deleteNote(${i})">删除</button></div></div>`).join('');}
function deleteNote(i){notes.splice(i,1);renderNotes();saveNotes();showToast('笔记已删除');}
function saveNotes(){try{localStorage.setItem('englishNotes',JSON.stringify(notes));}catch(e){}}

// ===== Favorites =====
let favorites=[];
function toggleFavorite(word,phonetic,meaning){const idx=favorites.findIndex(f=>f.word===word);if(idx>=0){favorites.splice(idx,1);showToast('已取消收藏');}else{favorites.push({word,phonetic,meaning});showToast('已收藏「'+word+'」');}renderFavorites();saveFavorites();}
function renderFavorites(){const c=document.getElementById('favList');if(!c)return;const cnt=document.getElementById('favCount');if(cnt)cnt.textContent=favorites.length;if(favorites.length===0){c.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-tertiary);font-size:14px">还没有收藏的单词，在词书或复习中点击星标收藏吧！</div>';return;}c.innerHTML=favorites.map((f,i)=>`<div class="word-item"><div class="word-num">${i+1}</div><div class="word-content"><div class="word-row"><span class="word-text">${f.word}</span><span class="word-phonetic">${f.phonetic}</span></div><div class="word-meaning">${f.meaning}</div></div><button class="tts-btn" onclick="event.stopPropagation();speak('${f.word}')">🔊</button><span class="fav-star active" onclick="toggleFavorite('${f.word}')">★</span></div>`).join('');}
function removeFavorite(i){favorites.splice(i,1);renderFavorites();saveFavorites();showToast('已取消收藏');}
function saveFavorites(){try{localStorage.setItem('englishFavorites',JSON.stringify(favorites));}catch(e){}}

// ===== Search =====
function openSearch(){document.getElementById('searchModal').classList.add('show');const input=document.getElementById('searchModalInput');input.value='';input.focus();document.getElementById('searchResults').innerHTML='<div style="padding:24px;text-align:center;color:var(--text-tertiary);font-size:14px">输入关键词搜索单词、表达、语法、文章、新闻...</div>';}
function closeSearch(){document.getElementById('searchModal').classList.remove('show');}
function performSearch(q){const results=document.getElementById('searchResults');if(!q||q.trim().length<1){results.innerHTML='<div style="padding:24px;text-align:center;color:var(--text-tertiary);font-size:14px">输入关键词搜索单词、表达、语法、文章、新闻...</div>';return;}q=q.toLowerCase().trim();const matches=[];reviewWords.forEach(w=>{if(w.word.toLowerCase().includes(q)||w.meaning.toLowerCase().includes(q))matches.push({type:'word',label:'单词',text:w.word,sub:w.meaning,action:`speak('${w.word}')`});});exprs.forEach(e=>{if(e.en.toLowerCase().includes(q)||e.cn.toLowerCase().includes(q))matches.push({type:'expression',label:'表达',text:e.en,sub:e.cn,action:`showToast('打开表达：${e.en}')`});});grammarTopics.forEach(g=>{if(g.title.toLowerCase().includes(q)||g.desc.toLowerCase().includes(q))matches.push({type:'grammar',label:'语法',text:g.title,sub:g.desc,action:`switchPage('grammar')`});});readingArticles.forEach(a=>{if(a.title.toLowerCase().includes(q)||a.excerpt.toLowerCase().includes(q))matches.push({type:'reading',label:'阅读',text:a.title,sub:a.excerpt.substring(0,60)+'...',action:`openReading(${a.id})`});});newsArticles.forEach(a=>{if(a.title.toLowerCase().includes(q)||a.excerpt.toLowerCase().includes(q))matches.push({type:'news',label:'新闻',text:a.title,sub:a.excerpt.substring(0,60)+'...',action:`openNews(${a.id})`});});if(matches.length===0){results.innerHTML='<div style="padding:24px;text-align:center;color:var(--text-tertiary);font-size:14px">没有找到匹配结果 😅</div>';return;}const typeColors={word:'#FEF3C7/#92400E',expression:'#DBEAFE/#1E40AF',grammar:'#EDE9FE/#5B21B6',reading:'#D1FAE5/#065F46',news:'#FED7AA/#9A3412'};results.innerHTML=matches.slice(0,30).map(m=>{const[bg,clr]=typeColors[m.type].split('/');return `<div class="search-result-item" onclick="${m.action};closeSearch()"><span class="search-result-type" style="background:${bg};color:${clr}">${m.label}</span><div><div class="search-result-text">${m.text}</div><div class="search-result-sub">${m.sub}</div></div></div>`;}).join('');}
document.addEventListener('DOMContentLoaded',function(){const inp=document.getElementById('searchModalInput');if(inp)inp.addEventListener('input',function(){performSearch(this.value);});document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSearch();});});

let currentDialogueFilter='all';
function renderDialogue(){const c=document.getElementById('dialogueList');if(!c)return;const filtered=currentDialogueFilter==='all'?dialogueData:dialogueData.filter(d=>d.level===currentDialogueFilter);c.innerHTML=filtered.map(d=>`<div class="dialogue-scene"><div class="dialogue-header"><span class="dialogue-emoji">${d.emoji}</span><div><div class="dialogue-title">${d.title}</div><span class="dialogue-level reading-tag ${d.level}">${d.levelLabel}</span></div><button class="btn btn-ghost" onclick="speakDialogue(${d.id})" style="margin-left:auto">🔊 朗读</button></div><div class="dialogue-bubbles">${d.bubbles.map(b=>`<div class="dialogue-bubble ${b.side}"><div class="dialogue-speaker">${b.speaker}</div>${b.en}<div class="dialogue-translation">${b.cn}</div></div>`).join('')}</div><div class="dialogue-actions"><button class="btn btn-primary" onclick="showToast('开始角色扮演练习：${d.title}')">角色扮演</button><button class="btn btn-ghost" onclick="showToast('开始填空练习：${d.title}')">填空练习</button></div></div>`).join('');}
function filterDialogue(btn,level){btn.parentElement.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentDialogueFilter=level;renderDialogue();}
function speakDialogue(id){const d=dialogueData.find(x=>x.id===id);if(!d)return;let text=d.bubbles.map(b=>b.en).join('. ');speak(text);}

// ===== Frequency Sort =====
function sortByFrequency(){let allWords=[];bookWordsData.forEach((book,bi)=>{book.words.forEach((w,wi)=>{allWords.push({...w,book:book.title,bookIdx:bi,freqRank:bi*100+wi});});});allWords.sort((a,b)=>a.freqRank-b.freqRank);const modal=document.getElementById('bookModalOverlay');document.getElementById('bookModalTitle').innerHTML='📊 词频排序学习';document.getElementById('bookModalBody').innerHTML=`<div style="margin-bottom:16px;font-size:14px;color:var(--text-secondary)">按词频从高到低排列，优先掌握高频词。共 ${allWords.length} 词。</div><div class="book-word-list" style="max-height:400px;overflow-y:auto">${allWords.slice(0,50).map((w,i)=>`<div class="book-word-row ${w.learned?'learned':''}" onclick="speak('${w.word}')"><div class="book-word-num">${i+1}</div><div style="flex:1"><div style="display:flex;align-items:center;gap:8px"><span class="book-word-text">${w.word}</span><span class="book-word-phonetic">${w.phonetic}</span><span style="font-size:10px;padding:2px 6px;border-radius:8px;background:var(--bg-page);color:var(--text-tertiary)">${w.book}</span></div><div class="book-word-meaning">${w.meaning}</div></div><button class="tts-btn" onclick="event.stopPropagation();speak('${w.word}')">🔊</button></div>`).join('')}</div>`;document.getElementById('bookModalStudyBtn').style.display='none';modal.classList.add('show');}
